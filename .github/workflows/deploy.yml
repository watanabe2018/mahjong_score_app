name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      # シークレットからconfig.dartを生成(gitには一切コミットしない)
      - name: Generate config.dart from secret
        run: |
          cat > lib/config.dart << EOF
          class AppConfig {
            static const String anthropicApiKey = '${{ secrets.ANTHROPIC_API_KEY }}';
            static const String recognitionModel = 'claude-sonnet-5';
            static const String passwordStorageKey = 'app_shared_password';
          }
          EOF

      # base-href はリポジトリ名に合わせる (例: https://<user>.github.io/<repo>/)
      - run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
